name: Images

on:
  pull_request:
    branches: [develop]
    paths:
      - server/**
      - web/**
      - docker-compose.yml
      - .github/workflows/images.yml

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: images — build, smoke, size
    runs-on: ubuntu-latest # GitHub-hosted: на self-hosted раннере docker нет
    steps:
      - uses: actions/checkout@v4
        with:
          path: pr
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Build base (before) and PR (after)
        run: |
          docker build -t rumcp-server:before base/server
          docker build -t rumcp-web:before base/web
          docker build -t rumcp-server:after pr/server
          docker build -t rumcp-web:after pr/web

      - name: Runtime stage is distroless, nonroot, no shell
        run: |
          for i in server web; do
            user=$(docker inspect -f '{{.Config.User}}' rumcp-$i:after)
            echo "$i user=$user"
            case "$user" in nonroot|65532|65532:65532) ;; *) echo "::error::$i is not nonroot"; exit 1;; esac
            if docker run --rm --entrypoint /bin/sh rumcp-$i:after -c true 2>/dev/null; then
              echo "::error::$i has a shell"; exit 1
            fi
          done

      - name: Smoke — compose up, server /healthz, web /
        working-directory: pr
        run: |
          docker compose up -d --build
          ok_s=0; ok_w=0
          for n in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && ok_s=1
            curl -fsS http://localhost:3000/ >/dev/null 2>&1 && ok_w=1
            [ "$ok_s$ok_w" = "11" ] && break
            sleep 2
          done
          docker compose ps
          if [ "$ok_s$ok_w" != "11" ]; then
            docker compose logs --tail 80
            echo "::error::smoke failed (server=$ok_s web=$ok_w)"; exit 1
          fi
          docker compose down -v

      - name: Image sizes before / after
        run: |
          {
            echo "### Image size before (alpine, base) / after (distroless, PR)"
            echo '```'
            docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' | grep -E 'REPOSITORY|rumcp-(server|web)'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
