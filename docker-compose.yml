name: rumcp

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rumcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rumcp}
      POSTGRES_DB: ${POSTGRES_DB:-rumcp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rumcp} -d ${POSTGRES_DB:-rumcp}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-rumcp}:${POSTGRES_PASSWORD:-rumcp}@postgres:5432/${POSTGRES_DB:-rumcp}?sslmode=disable
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # Значения по умолчанию только для локального запуска; в проде свои секреты.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-dev-only-token-encryption-key-32}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret}
      DAILY_LIMIT: ${DAILY_LIMIT:-100}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_TEST_TOKEN: ${YANDEX_TEST_TOKEN:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # Публичные значения SEO и аналитики; пустые — счётчик и тег не рендерятся.
        VITE_METRIKA_ID: ${VITE_METRIKA_ID:-}
        VITE_WEBMASTER_VERIFICATION: ${VITE_WEBMASTER_VERIFICATION:-}
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      API_URL: http://server:8080
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
