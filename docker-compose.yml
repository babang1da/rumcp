name: rumcp

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rumcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rumcp}
      POSTGRES_DB: ${POSTGRES_DB:-rumcp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rumcp} -d ${POSTGRES_DB:-rumcp}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-rumcp}:${POSTGRES_PASSWORD:-rumcp}@postgres:5432/${POSTGRES_DB:-rumcp}?sslmode=disable
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    environment:
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
